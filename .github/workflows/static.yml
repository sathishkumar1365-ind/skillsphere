# SkillSphere – build the Flutter web app and publish it to GitHub Pages.
# Runs on every push to main, and can be started by hand from the Actions tab.
# All actions below run on Node.js 24 (no Node 20 deprecation warning).

name: Deploy SkillSphere web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build web (release)
        # Site URL is https://<username>.github.io/<repo-name>/ so the base href
        # must be /<repo-name>/  (here: /skillsphere/).
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
